<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f6f3"/>
      <stop offset="48%" stop-color="#e7e5e2"/>
      <stop offset="100%" stop-color="#c9c6c2"/>
    </linearGradient>
    <radialGradient id="light" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple" cx="0.88" cy="0.18" r="0.38">
      <stop offset="0%" stop-color="#8d6ab8" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#8d6ab8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="saffron" cx="0.14" cy="0.82" r="0.34">
      <stop offset="0%" stop-color="#d28a1a" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#d28a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="marble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .018" numOctaves="5" seed="23" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        1.3 0 0 0 -.15
        0 1.3 0 0 -.15
        0 0 1.3 0 -.15
        0 0 0 .58 0" result="contrast"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="54" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#light)"/>
  <rect width="1600" height="1000" fill="url(#purple)"/>
  <rect width="1600" height="1000" fill="url(#saffron)"/>

  <g fill="none" filter="url(#marble)" opacity=".92">
    <path d="M-80 980 C180 760, 250 810, 430 650 S730 470, 840 250 S1050 160, 1180 -80"
      stroke="#8e9297" stroke-width="11" stroke-linecap="round" opacity=".46"/>
    <path d="M-110 1010 C160 785, 300 810, 460 660 S770 510, 880 285 S1060 210, 1215 -70"
      stroke="#f9f9f7" stroke-width="23" stroke-linecap="round" opacity=".70"/>
    <path d="M-100 970 C170 760, 280 790, 440 640 S745 485, 860 270 S1050 190, 1200 -90"
      stroke="#c38a37" stroke-width="3.2" stroke-linecap="round" opacity=".68"/>
    <path d="M250 -80 C390 180, 500 120, 610 340 S840 510, 790 760 S1030 960, 1120 1080"
      stroke="#b1b4b8" stroke-width="8" opacity=".31"/>
    <path d="M250 -90 C400 170, 500 140, 620 350 S850 520, 800 760 S1030 955, 1130 1080"
      stroke="#f5f4f1" stroke-width="18" opacity=".55"/>
    <path d="M260 -90 C405 170, 505 135, 620 350 S850 520, 800 760 S1030 955, 1130 1080"
      stroke="#b47d2c" stroke-width="2.4" opacity=".38"/>
    <path d="M980 1040 C1080 820, 1110 720, 1260 590 S1450 400, 1680 330"
      stroke="#969ba0" stroke-width="7" opacity=".28"/>
    <path d="M980 1040 C1085 820, 1115 720, 1265 590 S1455 400, 1680 330"
      stroke="#ffffff" stroke-width="17" opacity=".50"/>
  </g>

  <g opacity=".20" filter="url(#soft)">
    <path d="M-100 620 C320 420, 480 500, 720 310 S1130 60, 1700 150"
      stroke="#ffffff" stroke-width="55" fill="none"/>
    <path d="M-100 930 C260 830, 470 910, 740 760 S1250 520, 1690 600"
      stroke="#7d6a91" stroke-width="28" fill="none"/>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity=".28"/>
</svg>